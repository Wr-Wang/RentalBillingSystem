# ============================================================
#  rbs-api 后端 Deployment
#
#  用法：
#    kubectl apply -f api-deployment.yaml
#
#  前置：
#    1) 镜像已导入集群（rbs-api:latest）：
#       docker build -f src/RBS.Api/Dockerfile -t rbs-api:latest .
#       kind load docker-image rbs-api:latest --name rbs
#    2) SQL Server 已开启 TCP 1433 并绑定 0.0.0.0（见部署手册阶段 1）
#    3) hostAliases 的 IP 改为自己机器的实际 IP：
#       验证方法（kind 创建后执行）：
#         docker exec rbs-worker getent hosts host.docker.internal
#       把输出的第一列 IP 填到这里。
#
#  ⚠️ replicas 从 1 扩到 3（2026-09-01，用户要求）：
#     并发安全已由 SqlMaps.xml 的 Scheduling.Insert.Execution.Default 改为
#     原子条件插入（UPDLOCK+HOLDLOCK 的 WHERE NOT EXISTS）保证——多副本
#     每小时并发生成时只允许一条执行记录生效，不会重复生成/重复出账。
#     注意：JobScheduleExecutionService.GenerateAsync（手动"重新生成"）
#     仍是"先删未来→重建"，单用户单次点击不会并发，无需处理。
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbs-api
  labels:
    app: rbs-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rbs-api
  template:
    metadata:
      labels:
        app: rbs-api
    spec:
      # 让 Pod 内 host.docker.internal 解析到宿主机 IP（Windows 上的 SQL Server）。
      # 相当于 Docker compose 的 extra_hosts。默认值是 Docker Desktop WSL2 网关，
      # 换机器务必改成自己的 IP。查宿主 IP（任选其一）：
      #   docker exec rbs-worker getent hosts host.docker.internal
      #   docker exec rbs-worker cat /etc/hosts   # host.docker.internal 未解析时的兜底
      hostAliases:
        - ip: "192.168.65.254"
          hostnames:
            - "host.docker.internal"
      containers:
        - name: rbs-api
          image: rbs-api:latest
          imagePullPolicy: IfNotPresent   # 节点本机有镜像就用本机（kind load 导入的），不强制去仓库拉
          ports:
            - containerPort: 8080         # API 监听端口（ASP.NET Core）
          env:
            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            # 覆盖 appsettings.json 的连接串：指向宿主机 SQL Server（TCP 1433）。
            # host.docker.internal 由上面 hostAliases 解析到宿主机 IP。
            - name: ConnectionStrings__DefaultConnection
              value: "Server=host.docker.internal,1433;Database=RBS;User Id=sa;Password=123456;TrustServerCertificate=true;MultipleActiveResultSets=true;Max Pool Size=100;Min Pool Size=10;Connection Timeout=30;"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          # 探针用 Swagger 元数据端点（匿名 GET，200 即可）。
          # 前提：appsettings.json 的 Swagger:Enabled=true（Production 下也开启）。
          livenessProbe:
            httpGet:
              path: /swagger/v1/swagger.json
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /swagger/v1/swagger.json
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
