# ============================================================
#  web 前端 nginx 配置
#
#  职责：
#   1. 托管前端构建产物（/usr/share/nginx/html）
#   2. history 路由回退（刷新/直达子页面时返回 index.html）
#   3. 把 /api 请求反向代理到集群内的 API Service
#
#  关键点：API 与 web 同在一个 kind 集群，k8s 自带 DNS 解析
#  rbs-api-svc，nginx 直接 proxy_pass 到该 Service 即可。
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 前端路由（history 模式）----
    # 找不到对应文件的路径，一律回退到 index.html，交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- /api 反向代理 ----
    # 原样转发（保留 /api 前缀，不改写路径），目标为集群内 API Service（端口 8080）
    location /api/ {
        proxy_pass http://rbs-api-svc:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;                          # 转发原始 Host（前端站点）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;      # 后端导出 Excel/生成 PDF 可能较慢，放宽读超时
        proxy_send_timeout 60s;
    }

    # ---- 静态资源长缓存（带 hash 的文件名，放心缓存）----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 允许上传/导入等较大请求体（默认只有 1m，容易报 413）
    client_max_body_size 20m;
}
